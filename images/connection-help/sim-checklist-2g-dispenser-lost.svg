<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="288" viewBox="0 0 1120 288" role="img"><title>Проверки связи по SIM-карте</title><rect width="100%" height="100%" rx="12" fill="#253746"/><g font-family="Arial,sans-serif"><g transform="translate(24 20)"><rect width="524" height="56" rx="6" fill="#30495c"/><rect x="14" y="18" width="20" height="20" rx="2" fill="none" stroke="#a9c7de" stroke-width="2"/><text x="48" y="33" fill="#a9c7de" font-size="18">1.</text><text x="82" y="34" fill="#fff" font-size="20"><tspan x="82" dy="0">Перезагрузите ТРК</tspan></text></g><g transform="translate(24 84)"><rect width="524" height="56" rx="6" fill="#30495c"/><rect x="14" y="18" width="20" height="20" rx="2" fill="none" stroke="#a9c7de" stroke-width="2"/><text x="48" y="33" fill="#a9c7de" font-size="18">2.</text><text x="82" y="34" fill="#fff" font-size="20"><tspan x="82" dy="0">Проверьте интернет на SIM-карте</tspan></text></g><g transform="translate(24 148)"><rect width="524" height="56" rx="6" fill="#30495c"/><rect x="14" y="18" width="20" height="20" rx="2" fill="none" stroke="#a9c7de" stroke-width="2"/><text x="48" y="33" fill="#a9c7de" font-size="18">3.</text><text x="82" y="34" fill="#fff" font-size="20"><tspan x="82" dy="0">Уточните, нет ли ограничений связи</tspan></text></g><g transform="translate(24 212)"><rect width="524" height="56" rx="6" fill="#30495c"/><rect x="14" y="18" width="20" height="20" rx="2" fill="none" stroke="#a9c7de" stroke-width="2"/><text x="48" y="33" fill="#a9c7de" font-size="18">4.</text><text x="82" y="34" fill="#fff" font-size="20"><tspan x="82" dy="0">Откройте доступ к плате</tspan></text></g><g transform="translate(572 20)"><rect width="524" height="56" rx="6" fill="#30495c"/><rect x="14" y="18" width="20" height="20" rx="2" fill="none" stroke="#a9c7de" stroke-width="2"/><text x="48" y="33" fill="#a9c7de" font-size="18">5.</text><text x="82" y="24" fill="#fff" font-size="20"><tspan x="82" dy="0">Перевставьте SIM-карту и проверьте</tspan><tspan x="82" dy="23">контакты</tspan></text></g><g transform="translate(572 84)"><rect width="524" height="56" rx="6" fill="#30495c"/><rect x="14" y="18" width="20" height="20" rx="2" fill="none" stroke="#a9c7de" stroke-width="2"/><text x="48" y="33" fill="#a9c7de" font-size="18">6.</text><text x="82" y="34" fill="#fff" font-size="20"><tspan x="82" dy="0">Проверьте антенну</tspan></text></g><g transform="translate(572 148)"><rect width="524" height="56" rx="6" fill="#30495c"/><rect x="14" y="18" width="20" height="20" rx="2" fill="none" stroke="#a9c7de" stroke-width="2"/><text x="48" y="33" fill="#a9c7de" font-size="18">7.</text><text x="82" y="24" fill="#fff" font-size="20"><tspan x="82" dy="0">Попробуйте SIM-карту другого</tspan><tspan x="82" dy="23">оператора</tspan></text></g><g transform="translate(572 212)"><rect width="524" height="56" rx="6" fill="#30495c"/><rect x="14" y="18" width="20" height="20" rx="2" fill="none" stroke="#a9c7de" stroke-width="2"/><text x="48" y="33" fill="#a9c7de" font-size="18">8.</text><text x="82" y="34" fill="#fff" font-size="20"><tspan x="82" dy="0">Если связи по-прежнему нет</tspan></text></g></g></svg>